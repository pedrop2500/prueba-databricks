bundle:
  name: prueba-databricks

workspace:
  host: "https://dbc-20aaa784-c47e.cloud.databricks.com"
  root_path: "/Workspace/Users/${workspace.current_user.userName}/prueba-databricks"

variables:
  environment:
    description: Entorno de tablas y variables
    default: PRO

sync:
  include:
    - src/**
    - pipeline.py
    - config.toml
  exclude:
    - .venv/**
    - .bootstrap/**
    - dist/**
    - tests/**

resources:
  jobs:
    pipeline:
      name: prueba-databricks
      tasks:
        - task_key: pipeline
          environment_key: default
          spark_python_task:
            python_file: ./pipeline.py
            parameters: ["--env", "${var.environment}"]

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

targets:
  dev:
    default: true
    mode: development
